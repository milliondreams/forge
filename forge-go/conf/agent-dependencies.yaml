# ---------------------------------------------------------------------------
# LLM Dependencies
# ---------------------------------------------------------------------------
# NOTE: LiteLLMResolver.__init__(model, conf={}) accepts only `model` plus a
# `conf` dict; all other connection settings (base_url, api_version,
# vertex_project, custom_llm_provider, ...) must be nested under `conf:` or the
# resolver raises TypeError on instantiation. This mirrors the `textsplitter`
# entry above.

# --- Local llama.cpp server (OpenAI-compatible, port 55262) ---

llm:
  class_name: rustic_ai.litellm.agent_ext.llm.LiteLLMResolver
  provided_type: rustic_ai.core.guild.agent_ext.depends.llm.llm.LLM
  catalog:
    display_name: Qwen 3.5 0.8B Starter
    description: Default local OpenAI-compatible model
    provider: local
    capabilities: [chat]
    aliases: [qwen-0.8b, qwen]
    selectable: true
  properties:
    model: openai/rustic/qwen3.5-0.8b-starter
    conf:
      base_url: http://localhost:55262/v1

